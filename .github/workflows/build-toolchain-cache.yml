name: Build OpenWrt toolchain cache

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version"
        type: string
        required: true
        default: "21.02-SNAPSHOT"
      openwrt_arch:
        description: "OpenWrt arch"
        type: string
        required: true
        default: "aarch64_cortex-a53"
      openwrt_target:
        description: "OpenWrt target"
        type: string
        required: true
        default: "mediatek"
      openwrt_subtarget:
        description: "OpenWrt subtarget"
        type: string
        required: true
        default: "mt7986"

jobs:
  build:
    name: "Build toolchain cache for OpenWrt: ${{ inputs.openwrt_version }} - ${{ inputs.openwrt_arch }} :: ${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout amneziawg-openwrt
        uses: actions/checkout@v4
        with:
          path: amneziawg-openwrt
          fetch-depth: 0

      - name: Checkout OpenWrt repository
        uses: actions/checkout@v4
        with:
          path: openwrt
          repository: openwrt/openwrt
          ref: ${{ inputs.openwrt_version }}
          fetch-depth: 0

      - name: Build toolchain and kernel
        id: build-toolchain-kernel
        run: |
          set -x
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_TARGET_mediatek_mt7986=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7986_DEVICE_glinet_gl-mt6000=y" >> .config
          echo "CONFIG_ALL_KMODS=y" >> .config
          echo "CONFIG_ALL_NONSHARED=y" >> .config
          make defconfig
          make -j$(nproc) toolchain/install
          find bin/ -name "*.ipk" | head -20

      - name: Upload toolchain cache
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-toolchain-${{ inputs.openwrt_version }}-${{ inputs.openwrt_arch }}
          path: |
            openwrt/bin/
            openwrt/staging_dir/
            openwrt/build_dir/
